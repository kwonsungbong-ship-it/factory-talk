<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121a24">
<title>Factory Talk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* 현장용: 어두운 바탕, 큰 글씨, 큰 버튼, 한 손 조작 */
:root{
  --bg:#121a24; --panel:#1b2633; --line:#2c3a4b; --fg:#f2f5f8; --muted:#9fb0c2;
  --ko:#4f8ef7; --vi:#e4b43b; --zh:#ef6a5a; --ok:#3ccf8a; --bad:#ff6b6b;
  --f-body:"Noto Sans KR","Noto Sans SC","Noto Sans",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
header .st{font-size:12px;color:var(--muted)}
.opts{display:flex;gap:6px}
.opts button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:13px}
.opts button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
#log{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{background:var(--panel);border-radius:14px;padding:12px 14px;border-left:6px solid var(--line)}
.msg.ko{border-left-color:var(--ko)} .msg.vi{border-left-color:var(--vi)} .msg.zh{border-left-color:var(--zh)}
.msg .src{font-size:20px;line-height:1.35;font-weight:600;margin:0 0 8px}
.msg .src small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.tr{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.tr .tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:6px;margin-top:3px}
.tag.ko{background:var(--ko);color:#061126} .tag.vi{background:var(--vi);color:#2a1d02} .tag.zh{background:var(--zh);color:#2a0905}
.tr .txt{flex:1;min-width:0;font-size:24px;line-height:1.35;font-weight:700;word-break:break-word}
.tr .txt.wait{color:var(--muted);font-weight:400;font-size:16px}
.tr .play{flex:none;background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;width:44px;height:44px;font-size:18px}
.empty{color:var(--muted);text-align:center;margin:auto;font-size:15px;line-height:1.6}
footer{border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
#live{min-height:26px;font-size:16px;color:var(--muted);margin-bottom:8px;text-align:center;word-break:break-word}
#live.on{color:var(--fg)}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad{touch-action:manipulation;-webkit-touch-callout:none;border:none;border-radius:16px;height:92px;color:#fff;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  -webkit-tap-highlight-color:transparent;user-select:none;position:relative}
.pad.ko{background:var(--ko)} .pad.vi{background:var(--vi);color:#2a1d02} .pad.zh{background:var(--zh)}
.pad .big{font-size:22px;font-weight:800;line-height:1}
.pad .sub{font-size:12px;opacity:.85}
.pad.rec{animation:pulse 1s infinite;outline:3px solid #fff}
.pad.rec .sub{font-weight:800;opacity:1}
.pad.rec .sub::before{content:'■ '}
.pad:disabled{opacity:.35}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.err{background:#3a1d1d;border:1px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:8px;display:none}
.err.show{display:block}
#panel[hidden]{display:none}
#panel{max-height:60vh;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:10px}
#panel h2{font-size:16px;margin:0} #panel h3{font-size:13px;margin:6px 0 0;color:var(--muted)} #panel p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
#panel input,#panel textarea{width:100%;font:14px/1.4 var(--f-body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
#panel .row{display:flex;gap:8px;flex-wrap:wrap} #panel .row button{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:14px}
#gmsg{font-size:13px;min-height:18px} .mono{font-family:ui-monospace,monospace;user-select:all}
.ai{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--line);align-items:center}
.ai button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:14px}
.ai .note{font-size:12px;color:var(--muted)}
.tr .txt.ai-on{color:#cfe3ff}
@media (prefers-reduced-motion:reduce){.pad.rec{animation:none}}
</style>
</head>
<body>
<header>
  <div><h1>Factory Talk</h1><div class="st" id="status">버튼을 누르고 말하세요</div></div>
  <div class="opts">
    <button id="popup" aria-pressed="true" title="Google 음성 팝업 사용">팝업</button>
    <button id="tts" aria-pressed="false" title="번역 음성 자동 재생 (기본 꺼짐)">🔊 소리</button>
    <button id="clear" title="기록 지우기">🗑</button>
    <button id="cfg" title="설정">⚙</button>
  </div>
</header>

<section id="panel" hidden>
  <h2>AI 자연스러운 번역 (Gemini)</h2>
  <p>무료 키: <span class="mono">aistudio.google.com/apikey</span> 에서 발급 → 아래에 붙여넣기. 키는 이 폰에만 저장됩니다.</p>
  <input id="gkey" type="password" placeholder="AQ.... 또는 AIza... API 키" autocomplete="off">
  <div class="row"><button id="gsave">저장</button><button id="gtest">연결 테스트</button><button id="gdel">삭제</button></div>
  <div id="gmsg"></div>
  <h3>공장 용어 사전 (한국어 = 베트남어 = 중국어, 한 줄에 하나)</h3>
  <textarea id="gloss" rows="7" spellcheck="false"></textarea>
  <div class="row"><button id="gsaveg">사전 저장</button><button id="gclose">닫기</button></div>
</section>
<main id="log"><div class="empty">아래 버튼 중 <b>내가 말하는 언어</b>를 <b>한 번 누르고</b> 말하세요. 끝나면 버튼을 한 번 더 누르거나 잠시 기다리면 번역됩니다.<br>나머지 두 언어로 번역되어 바로 표시됩니다.<br><br>Nhấn ngôn ngữ của bạn và nói.<br>按你的语言，然后说话。</div></main>

<footer>
  <div class="err" id="err"></div>
  <div id="live"></div>
  <div id="dbg" style="font-size:10px;color:#56687c;word-break:break-all;min-height:12px"></div>
  <div class="pads">
    <button class="pad ko" data-lang="ko"><span class="big">한국어</span><span class="sub">눌러서 말하기</span></button>
    <button class="pad vi" data-lang="vi"><span class="big">Tiếng Việt</span><span class="sub">Nhấn để nói</span></button>
    <button class="pad zh" data-lang="zh"><span class="big">中文</span><span class="sub">点击说话</span></button>
  </div>
</footer>

<script>
(function(){
  const LANG = {
    ko:{name:'한국어', rec:'ko-KR', tts:'ko-KR', gt:'ko'},
    vi:{name:'Tiếng Việt', rec:'vi-VN', tts:'vi-VN', gt:'vi'},
    zh:{name:'中文', rec:'zh-CN', tts:'zh-CN', gt:'zh-CN'}
  };
  const $ = s=>document.querySelector(s);
  const log=$('#log'), live=$('#live'), status=$('#status'), err=$('#err');
  const pads=[...document.querySelectorAll('.pad')];
  let autoTTS=false, current=null, rec=null;

  const CAP = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ? window.Capacitor.Plugins : null;
  const NSR = CAP && CAP.SpeechRecognition, NTTS = CAP && CAP.TextToSpeech;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR && !NSR){ showErr('이 브라우저는 음성인식을 지원하지 않습니다. 폰에서는 Chrome(안드로이드) 또는 Safari(iPhone)로 열어주세요.'); pads.forEach(p=>p.disabled=true); }

  function showErr(m){ err.textContent=m; err.classList.add('show'); }
  function hideErr(){ err.classList.remove('show'); }

  let usePopup=true; try{ usePopup=localStorage.getItem('ft_popup')!=='0'; }catch(e){}
  $('#popup').setAttribute('aria-pressed',usePopup);
  if(!NSR) $('#popup').hidden=true;
  $('#popup').onclick=e=>{ usePopup=!usePopup; e.currentTarget.setAttribute('aria-pressed',usePopup); try{localStorage.setItem('ft_popup',usePopup?'1':'0');}catch(x){} };
  // ---- Gemini 설정 ----
  const DEFAULT_GLOSS=`갑피 = mũ giày = 鞋面
아웃솔 = đế ngoài = 大底
중창 = đế giữa = 中底
몰드 = khuôn = 模具
라스트 = phom giày = 鞋楦
접착 = dán keo = 粘合
재단 = cắt = 裁断
재봉 = may = 车缝
샘플 = mẫu = 样品
불량 = lỗi = 不良
라인 = chuyền = 生产线
확인 샘플 = mẫu xác nhận = 确认样`;
  let gkey='', gloss=DEFAULT_GLOSS, gmodel='';
  try{ gkey=localStorage.getItem('ft_gkey')||''; gloss=localStorage.getItem('ft_gloss')||DEFAULT_GLOSS; gmodel=localStorage.getItem('ft_gmodel')||''; }catch(e){}
  const panel=$('#panel'), gmsg=$('#gmsg');
  $('#gloss').value=gloss; if(gkey) $('#gkey').value=gkey;
  $('#cfg').onclick=()=>{ panel.hidden=!panel.hidden; };
  $('#gclose').onclick=()=>{ panel.hidden=true; };
  $('#gsave').onclick=()=>{ gkey=$('#gkey').value.trim(); try{localStorage.setItem('ft_gkey',gkey);}catch(e){} gmsg.textContent=gkey?'저장됨. "연결 테스트"로 확인하세요.':'키가 비어 있어요.'; };
  $('#gdel').onclick=()=>{ gkey=''; $('#gkey').value=''; try{localStorage.removeItem('ft_gkey');localStorage.removeItem('ft_gmodel');}catch(e){} gmodel=''; gmsg.textContent='삭제됨'; };
  $('#gsaveg').onclick=()=>{ gloss=$('#gloss').value; try{localStorage.setItem('ft_gloss',gloss);}catch(e){} gmsg.textContent='사전 저장됨'; };
  $('#gtest').onclick=async()=>{ gkey=$('#gkey').value.trim(); gmsg.textContent='테스트 중…'; try{ const m=await pickModel(true); const r=await gemini('안녕하세요','ko',['vi','zh']); gmsg.textContent='OK ('+m+'): '+r.vi+' / '+r.zh; }catch(e){ gmsg.textContent='실패: '+(e.message||e); } };
  async function pickModel(force){
    if(gmodel&&!force) return gmodel;
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':gkey}});
    if(!r.ok) throw new Error('키 확인 실패 HTTP '+r.status);
    const j=await r.json(); const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''));
    const ver=n=>{ const m=n.match(/^gemini-(\d+(?:\.\d+)?)-flash(-lite)?$/); return m?parseFloat(m[1])+(m[2]?0:0.001):-1; };
    const flash=names.filter(n=>ver(n)>=0).sort((a,b)=>ver(b)-ver(a));
    gmodel=flash[0]||names.find(n=>/flash/.test(n)&&!/exp|preview|image|tts|live|audio/.test(n))||names[0];
    if(!gmodel) throw new Error('사용 가능한 모델 없음');
    try{localStorage.setItem('ft_gmodel',gmodel);}catch(e){}
    return gmodel;
  }
  const LNAME={ko:'Korean',vi:'Vietnamese',zh:'Simplified Chinese'};
  async function gemini(text,src,targets){
    if(!gkey) throw new Error('API 키가 없어요 (⚙ 설정)');
    const model=await pickModel(false);
    const prompt=`You translate spoken sentences in a footwear (shoe) factory in Vietnam between Korean, Vietnamese and Chinese. Translate naturally as a factory coworker would say it: short, clear, polite workplace tone. Keep numbers, sizes, model names and dates exactly. Use this glossary when relevant (Korean = Vietnamese = Chinese):\n${gloss}\n\nSource language: ${LNAME[src]}\nSource: ${text}\n\nReturn ONLY JSON: {${targets.map(t=>'"'+t+'":"..."').join(',')}}`;
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':gkey},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}})});
    if(!r.ok){ let m='HTTP '+r.status; try{ const j=await r.json(); m+=' '+(j.error&&j.error.message||''); }catch(e){} throw new Error(m); }
    const j=await r.json(); let t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join('');
    t=t.replace(/^```json\s*|```$/g,'').trim();
    const o=JSON.parse(t); const out={}; targets.forEach(k=>out[k]=String(o[k]||'')); return out;
  }
  $('#tts').onclick=e=>{ autoTTS=!autoTTS; e.currentTarget.setAttribute('aria-pressed',autoTTS); };
  $('#clear').onclick=()=>{ log.innerHTML=''; };

  // 톡 누르면 듣기 시작, 한 번 더 누르면 종료 (말이 끝나면 자동 종료)
  pads.forEach(p=>{
    p.addEventListener('contextmenu',e=>e.preventDefault());
    p.addEventListener('click',e=>{ e.preventDefault(); if(current){ release(); return; } start(p.dataset.lang,p); });
  });
  function release(){
    if(NSR){ if(nativeOn){ try{NSR.stop().catch(()=>{});}catch(x){} setTimeout(finalizeNative,800); } return; }
    if(rec){ try{rec.stop();}catch(x){} }
  }

  let micOK=false;
  async function ensureMic(){
    if(micOK) return true;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return true;
    try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(t=>t.stop()); micOK=true; return true; }
    catch(e){ showErr('마이크 권한이 필요합니다. 주소창 왼쪽 자물쇠 → 권한 → 마이크 → 허용 후 새로고침해주세요. ('+e.name+')'); return false; }
  }
  async function start(lang,pad){
    if(NSR) return startNative(lang,pad);
    if(!(await ensureMic())) return;
    if(rec){ try{rec.abort();}catch(e){} }
    hideErr(); window.speechSynthesis && speechSynthesis.cancel(); NTTS && NTTS.stop().catch(()=>{});
    current=lang; pads.forEach(x=>x.classList.toggle('rec',x===pad));
    rec=new SR(); rec.lang=LANG[lang].rec; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
    live.textContent='…'; live.classList.add('on'); status.textContent=LANG[lang].name+' 듣는 중';
    let finalText='';
    rec.onresult=e=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText+=t; else interim+=t;
      }
      live.textContent=finalText+interim;
    };
    rec.onerror=e=>{
      if(e.error==='no-speech'){ status.textContent='소리가 안 들렸어요. 다시 눌러주세요'; }
      else if(e.error==='not-allowed'||e.error==='service-not-allowed'){ showErr('음성인식이 차단되었습니다 ('+e.error+'). 앱 안의 브라우저가 아닌 Chrome 앱을 직접 열어 주소를 입력하고, 폰 설정 → 앱 → Google 앱이 꺼져 있지 않은지 확인해주세요.'); }
      else if(e.error==='network'){ showErr('음성인식 서버에 연결할 수 없습니다. 인터넷을 확인해주세요.'); }
      else { status.textContent='오류: '+e.error; }
    };
    rec.onend=()=>{
      const text=(finalText||live.textContent).trim().replace(/^…$/,'');
      stop();
      if(text) handle(lang,text);
    };
    try{ rec.start(); }catch(e){ showErr('마이크를 시작할 수 없습니다: '+e.message); stop(); }
  }
  let nativeOn=false, lastPartial='', listenersOn=false, maxT=null, dbg=[];
  function J(x){ try{ return JSON.stringify(x===undefined?null:x)||''; }catch(e){ return String(x); } }
  function D(m){ dbg.push(m); if(dbg.length>8) dbg.shift(); const el=document.getElementById('dbg'); if(el) el.textContent=dbg.join(' | '); }
  function finalizeNative(){
    if(!nativeOn) return;
    const lang=current, text=(lastPartial||'').trim();
    stop(); if(text) handle(lang,text); else status.textContent='인식된 말이 없어요. 다시 눌러주세요';
  }
  async function startNative(lang,pad){
    hideErr();
    try{
      const p=await NSR.requestPermissions();
      if(p.speechRecognition!=='granted'){ showErr('마이크 권한이 필요합니다. 폰 설정 → 앱 → Factory Talk → 권한 → 마이크 허용'); return; }
      if(!listenersOn){
        listenersOn=true;
        await NSR.addListener('partialResults',d=>{ D('partial:'+J(d).slice(0,60)); const m=(d&&d.matches&&d.matches[0])||''; if(m){ lastPartial=m; live.textContent=m; } });
        await NSR.addListener('listeningState',d=>{ D('state:'+(d&&d.status)); if(d&&d.status==='stopped'&&nativeOn&&!usePopup) setTimeout(finalizeNative,300); });
      }
    }catch(e){ showErr('음성인식 준비 실패: '+(e.message||e)); return; }
    current=lang; nativeOn=true; lastPartial=''; pads.forEach(x=>x.classList.toggle('rec',x===pad));
    live.textContent='…'; live.classList.add('on'); status.textContent=LANG[lang].name+' 듣는 중';
    if(usePopup){
      try{
        D('start popup '+LANG[lang].rec);
        const r=await NSR.start({language:LANG[lang].rec,maxResults:3,partialResults:false,popup:true,prompt:LANG[lang].name});
        D('result:'+J(r).slice(0,80));
        const m=(r&&r.matches&&r.matches[0])||''; if(m) lastPartial=m;
        finalizeNative(); return;
      }catch(e){ D('popup err:'+((e&&e.message)||e)); stop(); status.textContent='인식 실패: '+((e&&e.message)||e); return; }
    }
    // 팝업 없음: 중간결과 이벤트로 받고, 멈춤/재터치/30초에 종료
    try{
      D('start nopopup '+LANG[lang].rec);
      status.textContent=LANG[lang].name+' 듣는 중 — 끝나면 버튼 한 번 더';
      clearTimeout(maxT); maxT=setTimeout(()=>{ if(nativeOn) release(); },30000);
      const r=await NSR.start({language:LANG[lang].rec,maxResults:3,partialResults:true,popup:false});
      D('start resolved:'+J(r).slice(0,60));
      const m=(r&&r.matches&&r.matches[0])||''; if(m){ lastPartial=m; finalizeNative(); }
    }catch(e){ D('err:'+((e&&e.message)||e)); if(lastPartial) finalizeNative(); else { stop(); status.textContent='인식 실패: '+((e&&e.message)||e); } }
  }
  function stop(){
    if(nativeOn){ nativeOn=false; try{NSR.stop().catch(()=>{});}catch(e){} }
    if(rec){ try{rec.stop();}catch(e){} }
    rec=null; current=null; pads.forEach(x=>x.classList.remove('rec'));
    live.textContent=''; live.classList.remove('on'); status.textContent='버튼을 누르고 말하세요';
  }

  async function handle(lang,text){
    if(log.querySelector('.empty')) log.innerHTML='';
    const targets=Object.keys(LANG).filter(k=>k!==lang);
    const card=document.createElement('div'); card.className='msg '+lang;
    card.innerHTML=`<p class="src"><small>${LANG[lang].name}</small>${esc(text)}</p>`+
      targets.map(t=>`<div class="tr" data-t="${t}"><span class="tag ${t}">${LANG[t].name}</span><div class="txt wait">번역 중…</div><button class="play" title="듣기">▶</button></div>`).join('');
    const ai=document.createElement('div'); ai.className='ai';
    ai.innerHTML='<button type="button">✨ 자연스럽게</button><span class="note">'+(gkey?'AI 번역 (Gemini)':'⚙ 설정에서 키 입력 필요')+'</span>';
    card.appendChild(ai);
    ai.querySelector('button').onclick=async e=>{
      const b=e.currentTarget, n=ai.querySelector('.note'); if(!gkey){ panel.hidden=false; return; }
      b.disabled=true; n.textContent='AI 번역 중…';
      try{ const o=await gemini(text,lang,targets);
        for(const t of targets){ const row=card.querySelector(`.tr[data-t="${t}"]`), out=row.querySelector('.txt'); if(o[t]){ out.textContent=o[t]; out.classList.add('ai-on'); row.querySelector('.play').onclick=()=>speak(o[t],LANG[t].tts); } }
        n.textContent='✨ AI 번역 적용됨'; b.hidden=true;
      }catch(err){ n.textContent='실패: '+(err.message||err); b.disabled=false; }
    };
    log.appendChild(card); log.scrollTop=log.scrollHeight;
    for(const t of targets){
      const row=card.querySelector(`.tr[data-t="${t}"]`), out=row.querySelector('.txt'), btn=row.querySelector('.play');
      try{
        const tr=await translate(text,LANG[lang].gt,LANG[t].gt);
        out.textContent=tr; out.classList.remove('wait');
        btn.onclick=()=>speak(tr,LANG[t].tts);
        if(autoTTS) speak(tr,LANG[t].tts);
      }catch(e){
        out.textContent='번역 실패: '+((e&&e.message)||e); out.style.color='var(--bad)'; D('tr err:'+((e&&e.message)||e));
        btn.disabled=true;
      }
      log.scrollTop=log.scrollHeight;
    }
  }

  async function translate(q,sl,tl){
    const u='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q='+encodeURIComponent(q);
    const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    return j[0].map(x=>x[0]).join('');
  }

  const queue=[];
  function speak(text,lang){
    if(NTTS){ NTTS.speak({text,lang,rate:0.95}).catch(()=>{}); return; }
    if(!window.speechSynthesis) return;
    const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=0.95;
    const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase().slice(0,2)));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

  function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
