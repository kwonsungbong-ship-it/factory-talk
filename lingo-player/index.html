<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="app-version" content="__APP_VERSION__">
<title>Lingo Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#101820;--panel:#182430;--panel2:#1f2e3c;--line:#2a3b4c;--text:#e6ecf0;--mute:#8da0b3;--acc:#54c8aa;--acc2:#ffd166;--danger:#ff6b6b;--fs:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Segoe UI",sans-serif;font-size:16px}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);color:#07211a;border-color:var(--acc);font-weight:700}
button.ghost{background:transparent;border-color:transparent}
button.icon{width:46px;height:46px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
input,select,textarea{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label{display:block;color:var(--mute);font-size:13px;margin:12px 0 4px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.hidden{display:none!important}
.muted{color:var(--mute);font-size:13px}
.msg{padding:10px 12px;font-size:14px;color:var(--mute);white-space:pre-wrap}
.msg.err{color:var(--danger)}
/* library */
#lib{padding:12px}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.addrow button{flex:1}
.track{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.track .info{flex:1;min-width:0}
.track .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .sub{font-size:12px;color:var(--mute);margin-top:3px}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.badge.ok{color:#07211a;background:var(--acc);border-color:var(--acc)}
.empty{text-align:center;color:var(--mute);padding:40px 16px;line-height:1.6}
/* player */
#player{display:flex;flex-direction:column;height:100%}
#lyrics{flex:1;overflow:auto;padding:24px 16px 45vh;scroll-behavior:smooth;font-size:var(--fs);line-height:1.75}
.line{margin:0 0 18px;padding:6px 10px;border-radius:10px;color:var(--mute);transition:background .15s}
.line.cur{color:var(--text);background:var(--panel)}
.line .tr{display:block;font-size:.72em;color:var(--mute);margin-top:2px;line-height:1.4}
.line.cur .tr{color:#b9c8d6}
body.notr .tr{display:none}
.w{display:inline-block;border-radius:6px;padding:0 3px;margin:0 1px;transition:background .08s}
.line.cur .w.done{color:#b9c8d6}
.w.now{background:var(--acc2);color:#1a1400;font-weight:700}
.line.cur .w:active{background:var(--panel2)}
#ctl{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
#bar{width:100%;margin:4px 0 2px;accent-color:var(--acc)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:center;gap:10px}
.row.small{gap:6px;margin-top:8px;flex-wrap:wrap}
.row.small button{padding:6px 10px;font-size:13px}
.row.small button.on{border-color:var(--acc);color:var(--acc)}
#play{width:62px;height:62px;border-radius:50%;font-size:26px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(92vw,440px);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 8px;font-size:18px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#wpop .word{font-size:28px;font-weight:700;margin-bottom:4px}
#wpop .ctx{color:var(--mute);font-size:14px;margin-bottom:10px}
#wpop .mean{font-size:17px;line-height:1.5;min-height:48px;white-space:pre-wrap}
#prog{display:flex;align-items:center;gap:10px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <button id="back" class="icon ghost hidden" title="목록">‹</button>
  <h1 id="title">Lingo Player</h1>
  <button id="btnAnalyze" class="hidden" title="단어 싱크 분석">분석</button>
  <button id="btnSet" class="icon ghost" title="설정">⚙</button>
</header>
<main>
  <section id="lib">
    <div class="addrow">
      <button id="btnAdd" class="pri">＋ 음악 파일 추가</button>
    </div>
    <div id="libMsg" class="msg hidden"></div>
    <div id="list"></div>
  </section>
  <section id="player" class="hidden">
    <div id="lyrics"></div>
    <div id="ctl">
      <input id="bar" type="range" min="0" max="1000" value="0">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      <div class="row">
        <button id="prevL" class="icon" title="이전 문장">⏮</button>
        <button id="back5" class="icon" title="5초 뒤로">↺</button>
        <button id="play" class="pri">▶</button>
        <button id="fwd5" class="icon" title="5초 앞으로">↻</button>
        <button id="nextL" class="icon" title="다음 문장">⏭</button>
      </div>
      <div class="row small">
        <button id="loop" title="현재 문장 반복">문장 반복</button>
        <button id="rate">1.0x</button>
        <button id="trToggle" class="on">번역</button>
        <button id="fsBtn">글자</button>
      </div>
    </div>
  </section>
</main>

<input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.opus,.webm,.aac,.flac" multiple class="hidden">

<dialog id="dSet">
  <h2>설정</h2>
  <label>음성 인식 엔진</label>
  <select id="engine">
    <option value="cloud">클라우드 (아래 서비스 제공자 사용)</option>
    <option value="local">기기 내 Whisper (오프라인, 모델 다운로드)</option>
  </select>
  <div id="localBox" class="hidden">
    <label>기기 내 모델</label>
    <select id="lmodel">
      <option value="onnx-community/whisper-small_timestamped">small (약 250MB, 권장)</option>
      <option value="onnx-community/whisper-base_timestamped">base (약 80MB, 빠름, 정확도 낮음)</option>
      <option value="onnx-community/whisper-medium_timestamped">medium (약 1GB, RAM 8GB+ 폰, 앱이 꺼질 수 있음)</option>
      <option value="onnx-community/whisper-large-v3-turbo_timestamped">large-v3-turbo (약 1.6GB, RAM 12GB+ 폰, 앱이 꺼질 수 있음)</option>
    </select>
    <div id="gpuInfo" class="muted" style="margin-top:4px;line-height:1.5"></div>
  </div>
  <label>서비스 제공자 <span class="muted">(클라우드 인식, 번역·단어 뜻)</span></label>
  <select id="prov">
    <option value="groq">Groq (무료 티어, Whisper large-v3)</option>
    <option value="openai">OpenAI (유료, whisper-1)</option>
  </select>
  <label id="keyLabel">API 키</label>
  <input id="key" type="password" placeholder="" autocomplete="off">
  <div id="provHelp" class="muted" style="margin-top:4px;line-height:1.5"></div>
  <div id="keyMsg" class="msg"></div>
  <textarea id="diag" rows="6" class="hidden" readonly style="font-size:12px;margin-top:8px"></textarea>
  <label>음성 언어 (분석 시 사용)</label>
  <select id="lang">
    <option value="">자동 감지</option>
    <option value="vi">베트남어</option>
    <option value="en">영어</option>
    <option value="zh">중국어</option>
    <option value="ja">일본어</option>
    <option value="ko">한국어</option>
    <option value="es">스페인어</option>
    <option value="fr">프랑스어</option>
  </select>
  <label>단어 힌트 <span class="muted">(선택, 클라우드 인식 시 철자 보정)</span></label>
  <textarea id="hint" rows="2" placeholder="교재 단어, 이름 등을 쉼표로: Hà Nội, phở, Nguyễn"></textarea>
  <label>두 번째 언어 <span class="muted">(음성에 두 언어가 섞여 있을 때, 클라우드 인식)</span></label>
  <select id="lang2">
    <option value="">없음</option>
    <option value="ko">한국어</option>
    <option value="vi">베트남어</option>
    <option value="en">영어</option>
    <option value="zh">중국어</option>
    <option value="ja">일본어</option>
  </select>
  <label>번역 언어</label>
  <select id="tlang">
    <option value="ko">한국어</option>
    <option value="en">English</option>
    <option value="vi">Tiếng Việt</option>
    <option value="zh">中文</option>
    <option value="ja">日本語</option>
  </select>
  <div class="dlg-actions">
    <button id="diagBtn">진단 정보</button>
    <button id="keyTest">키 테스트</button>
    <button id="setClose" class="pri">닫기</button>
  </div>
  <p class="muted" style="margin:14px 0 0;line-height:1.5">파일은 이 기기 안에만 저장됩니다. 클라우드 인식 시 오디오가 선택한 서비스(Groq 또는 OpenAI) 서버로 전송되고, 기기 내 인식 시에는 전송되지 않습니다. 결과는 기기에 저장되어 다시 분석하지 않습니다. 번역·단어 뜻은 엔진과 관계없이 서비스 제공자 키가 있을 때만 동작합니다.</p>
</dialog>

<dialog id="dProg">
  <h2>단어 싱크 분석 중</h2>
  <div id="prog"><span class="spin"></span><span id="progMsg">업로드 중…</span></div>
  <progress id="progBar" max="100" value="0" class="hidden" style="width:100%;margin-top:10px;accent-color:var(--acc)"></progress>
  <div class="dlg-actions"><button id="progCancel">취소</button></div>
</dialog>

<dialog id="wpop">
  <div class="word" id="wpWord"></div>
  <div class="ctx" id="wpCtx"></div>
  <div class="mean" id="wpMean"></div>
  <div class="dlg-actions">
    <button id="wpHere">여기부터 재생</button>
    <button id="wpClose" class="pri">닫기</button>
  </div>
</dialog>

<dialog id="dTrack">
  <h2 id="dtName" style="word-break:break-all"></h2>
  <div class="muted" id="dtSub"></div>
  <div class="dlg-actions" style="justify-content:space-between">
    <button id="dtDel" style="color:var(--danger)">삭제</button>
    <span><button id="dtReset">분석 초기화</button> <button id="dtClose" class="pri">닫기</button></span>
  </div>
</dialog>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const fmt=s=>{s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')};
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':(b/1024|0)+' KB';
const LANGN={vi:'베트남어',en:'영어',zh:'중국어',ja:'일본어',ko:'한국어',es:'스페인어',fr:'프랑스어'};
const TLN={ko:'Korean',en:'English',vi:'Vietnamese',zh:'Chinese',ja:'Japanese'};

/* ---------- IndexedDB ---------- */
const DB={
  _p:null,
  open(){ if(this._p) return this._p; this._p=new Promise((res,rej)=>{ const r=indexedDB.open('lingo',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('tracks',{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return this._p; },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('tracks',mode); const st=t.objectStore('tracks'); const q=fn(st); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  all(){ return this.tx('readonly',st=>st.getAll()); },
  get(id){ return this.tx('readonly',st=>st.get(id)); },
  put(t){ return this.tx('readwrite',st=>st.put(t)); },
  del(id){ return this.tx('readwrite',st=>st.delete(id)); }
};

/* ---------- state ---------- */
let tracks=[], cur=null, flat=[], lineEls=[], wordEls=[], curW=-1, curL=-1, loopOn=false, raf=0, objUrl=null;
const RATES=[0.5,0.7,0.85,1,1.25];
const audio=new Audio(); audio.preload='auto';
const PROV={
  groq:{name:'Groq',base:'https://api.groq.com/openai/v1',stt:'whisper-large-v3',chat:['openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3.8-27b'],judge:['openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3.8-27b'],ph:'gsk_…',help:'console.groq.com 에서 구글 계정으로 가입 후 API Keys 메뉴에서 키 생성. 카드 등록 없이 무료 (하루 약 8시간 분량).'},
  openai:{name:'OpenAI',base:'https://api.openai.com/v1',stt:'whisper-1',chat:['gpt-4o-mini'],judge:['gpt-4o-mini'],ph:'sk-…',help:'platform.openai.com 에서 키 생성. 선결제 필요 (Whisper 분당 약 $0.006).'}
};
let prov=PROV[LS.get('prov','groq')]?LS.get('prov','groq'):'groq';
const keyName=()=>prov==='openai'?'okey':'gkey';
const BUILTIN_GROQ=(k=>k.startsWith('__')?'':k)('__GROQ_KEY__'); // 빌드 시 GitHub Secret으로 치환
const resolveKey=()=>LS.get(keyName(),'')||(prov==='groq'?BUILTIN_GROQ:'');
let key=resolveKey();
function applyProv(){ const P=PROV[prov]; $('#prov').value=prov; $('#key').value=LS.get(keyName(),''); $('#key').placeholder=P.ph; $('#keyLabel').textContent=P.name+' API 키'; $('#provHelp').textContent=P.help; $('#keyMsg').textContent=(prov==='groq'&&BUILTIN_GROQ&&!LS.get('gkey',''))?'내장 키 사용 중 (비워 두면 내장 키, 입력하면 그 키 사용)':''; key=resolveKey(); }
applyProv();
$('#lang').value=LS.get('lang',''); $('#lang2').value=LS.get('lang2',''); $('#tlang').value=LS.get('tlang','ko');
$('#lang2').onchange=()=>LS.set('lang2',$('#lang2').value); $('#hint').value=LS.get('hint','');
let engine=LS.get('engine','cloud'); $('#engine').value=engine; $('#lmodel').value=LS.get('lmodel','onnx-community/whisper-small_timestamped')||'onnx-community/whisper-small_timestamped';
let hasGPU=!!navigator.gpu;
if(hasGPU){ navigator.gpu.requestAdapter().then(a=>{ hasGPU=!!a; applyEngine(); }).catch(()=>{ hasGPU=false; applyEngine(); }); }
const MEM=navigator.deviceMemory||0; // GB (크롬은 최대 8로 보고)
function applyEngine(){ $('#localBox').classList.toggle('hidden',engine!=='local');
  const big=/large|medium/.test($('#lmodel').value);
  let info=hasGPU?'WebGPU 사용 가능: 폰 GPU로 분석합니다. 모델은 처음 한 번만 내려받아 저장됩니다.':'이 기기는 WebGPU를 지원하지 않아 CPU로 동작합니다. small/base를 권장합니다.';
  if(big) info+=' 큰 모델은 메모리 부족으로 앱이 강제 종료될 수 있습니다'+(MEM?' (이 기기 메모리 약 '+MEM+'GB 이상)':'')+'. 꺼지면 다음 실행 때 자동으로 작은 모델로 바뀝니다.';
  $('#gpuInfo').textContent=info; }
// 기기 내 분석 도중 앱이 강제 종료된 경우 감지 (메모리 부족): 다음 실행 때 안내 + 작은 모델로 전환
const STEP={ log:[], mark(t){ const line=new Date().toISOString().slice(11,19)+' '+t; this.log.push(line); if(this.log.length>40) this.log.shift(); LS.set('stepLog',this.log.join('\n')); } };
function diagText(){ return ['앱 버전: '+(document.querySelector('meta[name=app-version]')||{}).content,'엔진: '+engine+' / 모델: '+$('#lmodel').value.split('/').pop(),'WebGPU: '+hasGPU+' / 메모리(GB): '+(navigator.deviceMemory||'?')+' / 코어: '+(navigator.hardwareConcurrency||'?'),'UA: '+navigator.userAgent,'마지막 강제 종료: '+LS.get('lastCrash','없음'),'--- 최근 단계 ---',LS.get('stepLog','')].join('\n'); }
$('#diagBtn').onclick=()=>{ const d=$('#diag'); d.classList.toggle('hidden'); d.value=diagText(); if(!d.classList.contains('hidden')){ d.focus(); d.select(); try{ navigator.clipboard&&navigator.clipboard.writeText(d.value); }catch(e){} } };
window.addEventListener('error',e=>STEP.mark('JS 오류: '+(e.message||e)));
window.addEventListener('unhandledrejection',e=>STEP.mark('Promise 오류: '+((e.reason&&e.reason.message)||e.reason)));
document.addEventListener('visibilitychange',()=>STEP.mark(document.hidden?'화면 가림(백그라운드)':'화면 복귀'));
(function crashGuard(){ const m=LS.get('localRunning','')||(LS.get('analyzing','')?'cloud':''); if(!m) return; LS.set('localRunning',''); LS.set('analyzing','');
  const last=(LS.get('stepLog','').split('\n').filter(l=>!/화면 (가림|복귀)/.test(l)).pop()||'').replace(/^\S+ /,''); LS.set('lastCrash',new Date().toLocaleString()+' / '+m.split('/').pop()+' / 단계: '+last);
  const order=['onnx-community/whisper-large-v3-turbo_timestamped','onnx-community/whisper-medium_timestamped','onnx-community/whisper-small_timestamped','onnx-community/whisper-base_timestamped'];
  const i=order.indexOf(m); const next=i>=0&&i<order.length-1?order[i+1]:'';
  if(m==='cloud'){ setTimeout(()=>alert('지난번 분석 중 앱이 종료됐습니다.\n\n최근 기록:\n'+LS.get('stepLog','')),300); return; }
  if(next){ LS.set('lmodel',next); $('#lmodel').value=next; }
  setTimeout(()=>alert('지난번 기기 내 분석 중 앱이 종료됐습니다 (마지막 단계: '+last+'). 메모리 부족으로 보입니다.'+(next?' 모델을 '+$('#lmodel').selectedOptions[0].textContent.split(' (')[0]+'(으)로 낮췄습니다. 다시 분석해 보세요.':' 클라우드(Groq) 엔진 사용을 권장합니다.')),300);
})();
applyEngine();
$('#engine').onchange=()=>{ engine=$('#engine').value; LS.set('engine',engine); applyEngine(); };
$('#lmodel').onchange=()=>{ LS.set('lmodel',$('#lmodel').value); applyEngine(); };
$('#hint').onchange=()=>LS.set('hint',$('#hint').value.trim());
document.documentElement.style.setProperty('--fs',LS.get('fs','20')+'px');
if(LS.get('notr','0')==='1'){ document.body.classList.add('notr'); $('#trToggle').classList.remove('on'); }

/* ---------- library ---------- */
async function loadLib(){ tracks=(await DB.all()).sort((a,b)=>b.added-a.added); renderLib(); }
function renderLib(){
  const list=$('#list'); list.innerHTML='';
  if(!tracks.length){ list.innerHTML='<div class="empty">아직 음악이 없습니다.<br>위 버튼으로 기기에 저장된 음악 파일을 추가하세요.<br><span class="muted">(유튜브에서 받은 MP3 등 25MB 이하)</span></div>'; return; }
  for(const t of tracks){
    const el=document.createElement('div'); el.className='track';
    const n=t.transcript?t.transcript.segments.length:0;

async function transcribe(t,signal){
  needKey();
  const lang=$('#lang').value, lang2=$('#lang2').value;
  if(lang2&&lang2!==lang&&await isMp3(t.blob)) return await transcribeBilingualPieces(t,lang,lang2,signal);
  const a=await whisperPass(t,lang,signal);
  if(!lang2||lang2===lang) return a;
  // 이중 언어(MP3가 아닌 파일): 통째로 두 번 인식 후 단어 단위 합치기
  $('#progMsg').textContent='두 번째 언어('+(LANGN[lang2]||lang2)+')로 인식 중…';
  const b=await whisperPass(t,lang2,signal);
  const flat=tr=>{ const W=[]; for(const sg of tr.segments) for(const w of sg.words) W.push({...w}); return W; };
  return await mergeBilingual(flat(a),flat(b),[],lang||a.language,lang2,signal);
}
// 이중 언어 조각 파이프라인: Whisper는 30초 창 단위로 디코딩하면서 앞 창의 텍스트를 문맥으로 쓰기 때문에, 두 언어가 섞인 긴 파일을
// 통째로 보내면 둘째 창부터 양쪽 언어 모두 망가진다. 오디오를 조용한 지점에서 약 25초 조각으로 잘라 조각마다 (1) 첫 언어 강제,
// (2) 둘째 언어 강제, (3) 영어 번역(뜻의 기준점) 세 번을 요청하고, 단어 단위로 합친다.
async function transcribeBilingualPieces(t,lang1,lang2,signal){
  $('#progMsg').textContent='오디오 분석 중 (조각 나누기)…';
  const u8=new Uint8Array(await t.blob.arrayBuffer()); const fr=mp3Frames(u8);
  if(fr.length<10) throw new Error('MP3 프레임을 읽을 수 없습니다.');
  const sr=fr[0].sr; const cum=new Float64Array(fr.length+1); for(let i=0;i<fr.length;i++) cum[i+1]=cum[i]+fr[i].samples;
  const dur=cum[fr.length]/sr;
  // 무음 찾기: 16k PCM의 50ms RMS
  let rms=null; try{ const pcm=await decodeTo16k(t.blob); const W=800; rms=new Float32Array(Math.ceil(pcm.length/W)); for(let i=0;i<rms.length;i++){ let a=0; const st=i*W, en=Math.min(pcm.length,st+W); for(let k=st;k<en;k++) a+=pcm[k]*pcm[k]; rms[i]=Math.sqrt(a/Math.max(1,en-st)); } }catch(e){ STEP.mark('무음 탐색 실패, 고정 간격 사용'); }
  const PIECE=25, cuts=[0];
  for(let tgt=PIECE; tgt<dur-5; tgt+=PIECE){ let best=tgt; if(rms){ let bv=Infinity; for(let x=Math.max(0,tgt-3); x<=Math.min(dur,tgt+3); x+=0.05){ const i=Math.min(rms.length-1,Math.floor(x*20)); if(rms[i]<bv){ bv=rms[i]; best=x; } } } cuts.push(best); }
  // 시각 → 프레임 인덱스 (그 시각 이후 첫 프레임)
  const t2f=x=>{ let lo=0,hi=fr.length-1; while(lo<hi){ const m=(lo+hi)>>1; if(cum[m]/sr<x) lo=m+1; else hi=m; } return lo; };
  const pieces=[]; for(let k=0;k<cuts.length;k++){ const a=k?t2f(cuts[k]):0, b=k+1<cuts.length?t2f(cuts[k+1]):fr.length; if(b>a) pieces.push({a,b}); }
  STEP.mark('이중 언어 조각 '+pieces.length+'개 ('+(dur|0)+'초)');
  const WA=[], WB=[], EN=[]; let langDet='';
  for(let k=0;k<pieces.length;k++){
    const P=pieces[k]; const blob=new Blob([u8.buffer.slice(fr[P.a].off,fr[P.b-1].off+fr[P.b-1].len)],{type:'audio/mpeg'});
    const sh=cum[P.a]/sr-(k?(1105+fr[P.a].samples)/sr:0); // 중간 조각은 디코더 지연만큼 늦게 들림
    const tag=' ('+(k+1)+'/'+pieces.length+' 조각)';
    $('#progMsg').textContent=(LANGN[lang1]||lang1||'자동')+' 인식 중…'+tag; const ja=await whisperRaw(blob,'audio/mpeg',lang1,signal); langDet=langDet||ja.language||'';
    $('#progMsg').textContent=(LANGN[lang2]||lang2)+' 인식 중…'+tag; const jb=await whisperRaw(blob,'audio/mpeg',lang2,signal);
    $('#progMsg').textContent='영어 번역(뜻 기준) 인식 중…'+tag; let je={segments:[]}; try{ je=await whisperRaw(blob,'audio/mpeg','',signal,true); }catch(e){ if(e.name==='AbortError') throw e; STEP.mark('번역 패스 실패 '+(k+1)+': '+(e.message||e)); }
    for(const w of (ja.words||[])){ const x=String(w.word).trim(); if(x) WA.push({w:x,s:+w.start+sh,e:+w.end+sh}); }
    for(const w of (jb.words||[])){ const x=String(w.word).trim(); if(x) WB.push({w:x,s:+w.start+sh,e:+w.end+sh}); }
    for(const g of (je.segments||[])){ const x=String(g.text||'').trim(); if(x) EN.push({text:x,s:+g.start+sh,e:+g.end+sh}); }
  }
  const tr=await mergeBilingual(WA,WB,EN,lang1||langDet,lang2,signal);
  tr.pieces=pieces.length; return tr;
}
// 언어별 문자 체계 판정: 그 언어로 "실제로 받아쓴" 문장인지 (강제 언어 패스가 다른 언어를 번역해 낸 경우 걸러내는 보조 신호)
const SCRIPT={ko:/[\uac00-\ud7a3]/,ja:/[\u3040-\u30ff\u4e00-\u9fff]/,zh:/[\u4e00-\u9fff]/,vi:/[a-zA-Z\u00c0-\u1ef9]/,en:/[a-zA-Z]/,es:/[a-zA-Z]/,fr:/[a-zA-Z]/};
// 이중 언어 합치기 (단어 단위): 두 패스의 단어를 시간순으로 섞어 발화(간격 0.35초)로 묶고,
// 발화마다 "실제로 그 언어로 말한 쪽"을 LLM이 고른다. 틀린 언어로 강제된 패스는 음차 헛소리나 번역이 되므로 구분이 쉽다.
// (Groq의 avg_logprob는 30초 창 단위라 발화별 신뢰도 비교가 불가능해 LLM 판정을 쓴다)
async function mergeBilingual(wa,wb,EN,langA,langB,signal){
  const W=[]; for(const w of wa) W.push({...w,src:0}); for(const w of wb) W.push({...w,src:1});
  W.sort((x,y)=>x.s-y.s||x.src-y.src);
  const cl=[]; let c=null;
  for(const w of W){ if(!c||w.s-c.e>0.35){ c={s:w.s,e:w.e,A:[],B:[]}; cl.push(c); } (w.src?c.B:c.A).push(w); c.e=Math.max(c.e,w.e); }
  // 영어 번역 조각을 발화에 붙인다 (시간이 겹치는 것)
  const enOf=c=>EN.filter(g=>Math.min(g.e,c.e)-Math.max(g.s,c.s)>0.05).map(g=>g.text).join(' ');
  const text=ws=>ws.map(w=>w.w).join(' ');
  const items=cl.map((c,i)=>({i,A:text(c.A),B:text(c.B),E:enOf(c)}));
  const both=items.filter(it=>it.A&&it.B);
  const choice=new Array(cl.length).fill(null);
  // 휴리스틱(기본값): 문자 체계가 안 맞으면 반대쪽
  for(const it of both){ const okA=!SCRIPT[langA]||SCRIPT[langA].test(it.A), okB=!SCRIPT[langB]||SCRIPT[langB].test(it.B); choice[it.i]=okA&&!okB?'A':(!okA&&okB?'B':'A'); }
  const LN={ko:'Korean',vi:'Vietnamese',en:'English',zh:'Chinese',ja:'Japanese',es:'Spanish',fr:'French'};
  const nA=LN[langA]||langA||'the first language', nB=LN[langB]||langB;
  let judged=0;
  for(let i=0;i<both.length;i+=30){
    const part=both.slice(i,i+30);
    $('#progMsg').textContent='언어 구간 판정 중… ('+Math.min(i+30,both.length)+'/'+both.length+')';
    try{
      const j=await chat([{role:'system',content:`You are checking Whisper transcripts of a ${nA} lesson for ${nB} speakers. Each item has two transcripts of the SAME short utterance: A = Whisper forced to ${nA}, B = Whisper forced to ${nB}. Only one language was actually spoken in each utterance. When Whisper is forced to the wrong language it produces phonetic gibberish (the other language's sounds rendered as meaningless ${nA} syllables or meaningless ${nB} syllables). Some items also have E = Whisper's rough English translation of the same utterance (whatever language was spoken); the genuine transcript should MEAN roughly what E says, the gibberish will not. Procedure for each item: (1) Is A a real, meaningful ${nA} word or phrase, and does it match E? (2) Is B a real, meaningful ${nB} word or phrase, and does it match E? (3) Choose the one that is real; if both look real, prefer the one whose meaning matches E, then the lesson pattern (a ${nA} item is usually followed by its ${nB} meaning); if neither looks real, pick the less broken one. Return only JSON {"r":[{"i":<item i>,"c":"A"|"B"},...]} with one entry per item, no commentary.`},{role:'user',content:JSON.stringify(part.map(x=>x.E?{i:x.i,A:x.A,B:x.B,E:x.E}:{i:x.i,A:x.A,B:x.B}))}],signal,PROV[prov].judge,0);
      const arr=Array.isArray(j.r)?j.r:(Array.isArray(j.choices)?j.choices.map((c,k)=>({i:part[k]&&part[k].i,c})):[]);
      for(const x of arr){ const v=String(x.c||'').toUpperCase(); if((v==='A'||v==='B')&&choice[x.i]!==undefined&&both.some(it=>it.i===x.i)){ choice[x.i]=v; judged++; } }
    }catch(e){ if(e.name==='AbortError') throw e; console.warn('judge',e); STEP.mark('언어 판정 실패: '+(e.message||e)); }
  }
  STEP.mark('언어 판정 '+judged+'/'+both.length+' (발화 '+cl.length+')');
  // 발화 → 줄: 같은 언어가 이어지고 간격이 짧으면 한 줄로 합친다 (최대 12단어)
  const segs=[];
  for(let i=0;i<cl.length;i++){ const c=cl[i]; const pick=c.A.length&&c.B.length?choice[i]:(c.A.length?'A':'B'); const ws=pick==='A'?c.A:c.B; if(!ws.length) continue;
    const last=segs[segs.length-1];
    if(last&&last.pick===pick&&c.s-last.e<0.5&&last.words.length+ws.length<=12){ last.words.push(...ws); last.e=Math.max(last.e,c.e); }
    else segs.push({s:c.s,e:c.e,pick,words:[...ws]}); }
  const out=segs.map(x=>({s:x.s,e:x.e,text:text(x.words),words:x.words.map(({src,...w})=>w)}));
  return {language:(langA||'?')+'+'+langB,segments:out,text:out.map(x=>x.text).join(' '),judged,judgeTotal:both.length};
}
async function whisperPass(t,lang,signal){
  if(t.size>24*1048576){
    if(!(await isMp3(t.blob))) throw new Error('파일이 25MB를 넘습니다. 무료 Whisper API는 25MB 이하만 받습니다. MP3로 변환하면 앱이 자동으로 나눠서 보냅니다.');
    // MP3는 프레임 경계로 잘라 20MB씩 보내고, 각 조각의 시작 시각(프레임 수 기준)만큼 타임스탬프를 밀어 합친다
    const u8=new Uint8Array(await t.blob.arrayBuffer()); const fr=mp3Frames(u8);
    if(fr.length<10) throw new Error('MP3 프레임을 읽을 수 없습니다.');
    const sr=fr[0].sr, LIM=20*1048576; const parts=[]; let a=0, bytes=0, cum=0, startCum=0;
    for(let i=0;i<fr.length;i++){ bytes+=fr[i].len; cum+=fr[i].samples; if(bytes>=LIM){ parts.push({a,b:i+1,off:startCum/sr}); a=i+1; bytes=0; startCum=cum; } }
    if(a<fr.length) parts.push({a,b:fr.length,off:startCum/sr});
    const merged={language:'',text:'',words:[],segments:[]};
    for(let k=0;k<parts.length;k++){ const P=parts[k];
      $('#progMsg').textContent='Whisper 분석 중… ('+(k+1)+'/'+parts.length+' 조각'+(lang?', '+(LANGN[lang]||lang):'')+')';
      const blob=new Blob([u8.buffer.slice(fr[P.a].off,fr[P.b-1].off+fr[P.b-1].len)],{type:'audio/mpeg'});
      const j=await whisperRaw(blob,'audio/mpeg',lang,signal);
      const sh=P.off-(k?(1105+fr[P.a].samples)/sr:0); // 중간 조각은 디코더 지연만큼 늦게 들리므로 보정
      merged.language=merged.language||j.language||'';
      for(const w of (j.words||[])) merged.words.push({word:w.word,start:+w.start+sh,end:+w.end+sh});
      for(const g of (j.segments||[])) merged.segments.push({...g,start:+g.start+sh,end:+g.end+sh});
      merged.text+=(j.text||'')+' ';
    }
    return buildTranscript(merged);
  }
  const j=await whisperRaw(t.blob,t.type,lang,signal);
  return buildTranscript(j);
}
async function whisperRaw(blob,type,lang,signal,translate){
  const fd=new FormData();
  const ext=((type||'audio/mpeg').split('/')[1]||'mp3').replace('mpeg','mp3').replace('x-m4a','m4a');
  fd.append('file',blob,'audio.'+ext);
  fd.append('model',PROV[prov].stt);
  fd.append('response_format','verbose_json');
  if(!translate){ fd.append('timestamp_granularities[]','word'); fd.append('timestamp_granularities[]','segment'); if(lang) fd.append('language',lang); const hint=$('#hint').value.trim(); if(hint) fd.append('prompt',hint.slice(0,800)); }
  for(let attempt=0;;attempt++){
    const r=await fetch(PROV[prov].base+(translate?'/audio/translations':'/audio/transcriptions'),{method:'POST',headers:{Authorization:'Bearer '+key},body:fd,signal});
    if(r.ok) return await r.json();
    let msg=''; try{ const j=await r.json(); msg=(j.error&&j.error.message)||''; }catch(e){}
    if(r.status===429&&attempt<6){ const m=/try again in (?:(\d+)m)?([\d.]+)s/i.exec(msg); const wait=m?Math.min(120000,((+m[1]||0)*60+(+m[2]||0))*1000+1000):10000; STEP.mark('Whisper 429 대기 '+(wait/1000|0)+'초'); const prev=$('#progMsg').textContent; $('#progMsg').textContent=prev.replace(/ \(대기.*\)$/,'')+' (대기 '+(wait/1000|0)+'초: 무료 한도)'; await sleep(wait); continue; }
    if(r.status>=500&&attempt<2){ await sleep(3000); continue; }
    throw new Error('HTTP '+r.status+(msg?': '+msg:''));
  }
}
// Whisper는 단어 배열과 문장(segment) 배열을 따로 주므로 시간 기준으로 합친다.
function buildTranscript(j){
  const words=(j.words||[]).map(w=>({w:String(w.word).trim(),s:+w.start,e:+w.end})).filter(w=>w.w);
  let segs=(j.segments||[]).map(s=>({s:+s.start,e:+s.end,text:String(s.text||'').trim(),words:[],lp:(typeof s.avg_logprob==='number')?s.avg_logprob:undefined}));
  if(!segs.length){ // segment 없이 단어만 온 경우: 문장부호/간격으로 끊기
    let c=null;
    for(const w of words){ if(!c||w.s-c.e>1.0||c.words.length>=14||/[.!?。！？]$/.test(c.words[c.words.length-1].w)){ c={s:w.s,e:w.e,text:'',words:[]}; segs.push(c);} c.words.push(w); c.e=Math.max(c.e,w.e); }
    segs.forEach(s=>s.text=s.words.map(w=>w.w).join(' '));
  }else{
    let si=0;
    for(const w of words){
      while(si<segs.length-1 && w.s>=segs[si+1].s-0.05) si++;
      segs[si].words.push(w);
    }
    segs=segs.filter(s=>s.words.length||s.text);
    for(const s of segs){ if(!s.words.length) s.words=[{w:s.text,s:s.s,e:s.e}]; }
  }
  return {language:j.language||'',segments:segs,text:j.text||''};
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// 채팅 모델 호출: 모델이 사라졌으면(404/model_not_found) 다음 후보, JSON 강제가 실패하면 자유 출력에서 JSON 추출, 429는 잠시 후 재시도
async function chat(messages,signal,models,temperature){
  needKey();
  const list=models||PROV[prov].chat; let lastErr=null;
  for(const model of list){
    const oss=/gpt-oss/.test(model); // gpt-oss는 json_object 강제 시 추론이 깨져 품질이 떨어짐 → 자유 출력에서 JSON 추출, 추론 낮춤
    for(let attempt=0;attempt<4;attempt++){
      const json=!oss&&attempt<2; // 마지막 시도들은 response_format 없이

}
let MP3_CHUNK=1.5*1048576; // 약 1.5분(128kbps) 단위로 조각내어 디코딩: 메모리 피크를 수십 MB로 제한
// MP3 프레임 헤더를 훑어 프레임 경계와 프레임당 샘플 수를 구한다 (조각 디코딩 시 정확한 시간축 유지용)
function mp3Frames(u8){
  const BR=[[0,32,64,96,128,160,192,224,256,288,320,352,384,416,448],[0,32,48,56,64,80,96,112,128,160,192,224,256,320,384],[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320], // MPEG1 L1,L2,L3
            [0,32,48,56,64,80,96,112,128,144,160,176,192,224,256],[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160]]; // MPEG2/2.5 L1, L2+L3
  const SR={3:[44100,48000,32000],2:[22050,24000,16000],0:[11025,12000,8000]};

  if(u8[0]===0x49&&u8[1]===0x44&&u8[2]===0x33){ const sz=((u8[6]&0x7f)<<21)|((u8[7]&0x7f)<<14)|((u8[8]&0x7f)<<7)|(u8[9]&0x7f); pos=10+sz+((u8[5]&0x10)?10:0); }

    if(u8[pos]!==0xFF||(u8[pos+1]&0xE0)!==0xE0){ pos++; continue; }
    const ver=(u8[pos+1]>>3)&3, layer=(u8[pos+1]>>1)&3, bi=u8[pos+2]>>4, si=(u8[pos+2]>>2)&3, pad=(u8[pos+2]>>1)&1;

    else if(layer===2){ len=Math.floor(144*br/sr)+pad; samples=1152; }
    else { len=ver===3?Math.floor(144*br/sr)+pad:Math.floor(72*br/sr)+pad; samples=ver===3?1152:576; }

// 조각 디코딩 공통부: onChunk(pcm, 시작샘플위치)로 넘겨준다. 손상 프레임이 있는 조각은 작은 묶음으로 다시 디코딩해 살릴 수 있는 부분만 제자리에 놓는다.
async function decodeChunked(blob,rate,onChunk,onStep,onInfo){

  if(a<fr.length) bounds.push([a,fr.length]);
  // 프레임 [s0,e0)를 디코딩해 기대 길이만큼 돌려준다. 중간 조각은 디코더 지연(1105+1프레임)만큼 앞을 자르고, 끝 손실을 막기 위해 뒤에 3프레임을 더 붙여 디코딩한다.

      STEP.mark('손상 구간 복구 '+(i+1)+'/'+bounds.length);
      for(let g=s0; g<e0; g+=8){ const ge=Math.min(e0,g+8); try{ const q=await dec(g,ge); if(q.length) onChunk(q,toOut(cum[g])); }catch(e){} }
    }

  }
}
async function decodeTo16k(blob,onStep){
  if(blob.size>MP3_CHUNK*1.5 && await isMp3(blob)){
    let out=null, wp=0;
    await decodeChunked(blob,16000,(pcm,at)=>{ if(!out) out=new Float32Array(at+pcm.length);
      if(at+pcm.length>out.length){ const n=new Float32Array(Math.max(out.length*2,at+pcm.length)); n.set(out); out=n; }
      out.set(pcm,at); wp=Math.max(wp,at+pcm.length); },onStep,total=>{ out=new Float32Array(total); });
    return out?out.subarray(0,wp):new Float32Array(0);
  }
  if(blob.size>12*1048576) throw new Error('MP3가 아닌 큰 파일은 기기 내 분석 시 메모리가 부족할 수 있습니다. MP3로 변환하거나 클라우드 엔진을 사용해 주세요.');

}
// 손상된 MP3를 재생용 WAV(22.05kHz 모노 16bit)로 변환: 조각 디코딩으로 손상 프레임을 건너뛰고 제자리에 놓는다. Blob을 점진적으로 이어 붙여 메모리를 아낀다.
async function toPlayableWav(blob,onStep){
  const RATE=22050; let parts=[], total=0, wp=0; let wav=new Blob([]);
  const push=(i16)=>{ wav=new Blob([wav,i16]); total+=i16.length; };
  const put=(pcm,at)=>{ if(at>wp){ push(new Int16Array(at-wp)); wp=at; } const i16=new Int16Array(pcm.length); for(let i=0;i<pcm.length;i++){ const v=Math.max(-1,Math.min(1,pcm[i])); i16[i]=v<0?v*32768:v*32767; } push(i16); wp+=pcm.length; };
  if(await isMp3(blob)) await decodeChunked(blob,RATE,put,onStep); else put(await decodeBuf16k(await blob.arrayBuffer(),RATE),0);

  const str=(o,t)=>{ for(let i=0;i<t.length;i++) h.setUint8(o+i,t.charCodeAt(i)); };
  str(0,'RIFF'); h.setUint32(4,36+bytes,true); str(8,'WAVE'); str(12,'fmt '); h.setUint32(16,16,true); h.setUint16(20,1,true); h.setUint16(22,1,true); h.setUint32(24,RATE,true); h.setUint32(28,RATE*2,true); h.setUint16(32,2,true); h.setUint16(34,16,true); str(36,'data'); h.setUint32(40,bytes,true);

}
async function transcribeLocal(t,signal){
  STEP.log=[]; STEP.mark('기기 내 분석 시작 '+t.name+' '+fmtSize(t.size)); $('#progMsg').textContent='오디오 디코딩 중…';

  let audio; try{ audio=await decodeTo16k(t.blob,(i,n)=>{ $('#progMsg').textContent='오디오 디코딩 중… '+i+'/'+n; if(i%5===0||i===n) STEP.mark('디코딩 '+i+'/'+n); }); }catch(e){ LS.set('localRunning',''); throw new Error('오디오를 디코딩할 수 없습니다: '+(e.message||e)); }

  LS.set('localRunning',model); // 분석 중 강제 종료 감지용

      try{ return await runWorker(model,'webgpu',{encoder_model:'fp16',decoder_model_merged:'q4f16'},audio.slice(0),signal); }
      catch(e){ if(e.name==='AbortError'||!/webgpu|gpu|adapter/i.test(e.message||'')) throw e; hasGPU=false; applyEngine(); $('#progMsg').textContent='GPU 사용 불가, CPU로 전환…'; }
    }

    return await runWorker(model,'wasm','q8',audio,signal);
  } finally { LS.set('localRunning',''); if(worker){ try{ worker.terminate(); }catch(e){} worker=null; } /* 모델 메모리 해제 (다음 분석 때 캐시에서 다시 로드) */ }
}
function runWorker(model,device,dtype,audio,signal){
  return new Promise((res,rej)=>{
    if(!worker){ worker=new Worker('stt-worker.js',{type:'module'}); }
    const id=Math.random().toString(36).slice(2);
    const onAbort=()=>{ try{ worker.terminate(); }catch(e){} worker=null; $('#progBar').classList.add('hidden'); rej(Object.assign(new Error('abort'),{name:'AbortError'})); };
    signal.addEventListener('abort',onAbort,{once:true});
    worker.onerror=e=>{ signal.removeEventListener('abort',onAbort); $('#progBar').classList.add('hidden'); try{ worker.terminate(); }catch(x){} worker=null; rej(new Error('기기 내 인식 오류: '+(e.message||'워커 로드 실패 (인터넷 연결 후 다시 시도)'))); };
    worker.onmessage=e=>{ const m=e.data;
      if(m.type==='progress'){ if(m.total&&(m.loaded/m.total*10|0)!==(runWorker._p||0)){ runWorker._p=m.loaded/m.total*10|0; STEP.mark('모델 다운로드 '+(m.loaded/1048576|0)+'/'+(m.total/1048576|0)+'MB '+(m.file||'')); } $('#progBar').classList.remove('hidden'); $('#progBar').value=m.total?Math.round(m.loaded/m.total*100):0; $('#progMsg').textContent='모델 다운로드 중 '+(m.total?(m.loaded/1048576|0)+' / '+(m.total/1048576|0)+' MB':'')+' (처음 한 번만)'; }
      else if(m.type==='ready'){ STEP.mark('모델 로드 완료 ('+device+')'); $('#progBar').classList.add('hidden'); $('#progMsg').textContent='모델 준비 완료, 인식 시작…'; }
      else if(m.type==='status'){ STEP.mark(m.text); $('#progMsg').textContent=m.text+(device==='wasm'?' (CPU, 느릴 수 있음)':''); }
      else if(m.type==='done'&&m.id===id){ STEP.mark('인식 완료 '+m.words.length+'단어'); signal.removeEventListener('abort',onAbort); $('#progBar').classList.add('hidden'); const tr=buildTranscript({language:$('#lang').value,text:m.text,words:m.words}); res(tr); }
      else if(m.type==='error'&&m.id===id){ signal.removeEventListener('abort',onAbort); $('#progBar').classList.add('hidden'); try{ worker.terminate(); }catch(x){} worker=null; rej(new Error('기기 내 인식 실패: '+m.message)); }
    };
    STEP.mark('워커 시작 '+device+' '+JSON.stringify(dtype)); $('#progMsg').textContent='모델 확인 중…';
    worker.postMessage({id,model,device,dtype,audio,language:$('#lang').value||''},[audio.buffer]);
  });
}

const MS={
  on:!!(NMS||WMS), lastTitle:'',
  meta(title,artist,album){ if(!this.on) return; if(title===this.lastTitle&&artist===this.lastArtist) return; this.lastTitle=title; this.lastArtist=artist;
    const m={title,artist,album,artwork:[{src:NMS?ART_DATA:new URL('icon-512.png',location.href).href,sizes:'192x192',type:'image/png'}]};
    try{ if(NMS) NMS.setMetadata(m); else WMS.metadata=new MediaMetadata(m); }catch(e){} },
  state(st){ if(!this.on) return; try{ if(NMS) NMS.setPlaybackState({playbackState:st}); else WMS.playbackState=st; }catch(e){} },
  pos(){ if(!this.on||!isFinite(audio.duration)) return; const o={duration:audio.duration,playbackRate:audio.playbackRate,position:Math.min(audio.currentTime,audio.duration)}; try{ if(NMS) NMS.setPositionState(o); else WMS.setPositionState(o); }catch(e){} },
  handlers(){ if(!this.on||this._h) return; this._h=true;
    const H={play:()=>{ STEP.mark('잠금화면 재생'); audio.play(); },pause:()=>{ STEP.mark('잠금화면 일시정지'); userPause=true; audio.pause(); },stop:()=>{ userPause=true; audio.pause(); seek(0); },
      previoustrack:()=>$('#prevL').click(),nexttrack:()=>$('#nextL').click(),
      seekbackward:d=>seek(audio.currentTime-((d&&d.seekOffset)||5)),seekforward:d=>seek(audio.currentTime+((d&&d.seekOffset)||5)),
      seekto:d=>{ if(d&&d.seekTime!=null) seek(d.seekTime); }};
    for(const a in H){ try{ if(NMS) NMS.setActionHandler({action:a},H[a]); else WMS.setActionHandler(a,H[a]); }catch(e){} } }
};
// 잠금화면에 현재 문장(+번역)을 제목처럼 표시
function updateLockText(){ if(!cur) return; let title=cur.name, artist='Lingo Player';
  if(cur.transcript&&curL>=0){ const seg=cur.transcript.segments[curL]; const tr=(cur.translations[$('#tlang').value]||[])[curL]; title=seg.text; artist=tr||cur.name; }
  MS.meta(title,artist,cur.name); }

/* ---------- player ---------- */
async function openPlayer(t){
  STEP.mark('곡 열기 '+t.name); cur=await DB.get(t.id)||t;
  $('#lib').classList.add('hidden'); $('#player').classList.remove('hidden'); $('#back').classList.remove('hidden'); $('#btnAnalyze').classList.remove('hidden');
  $('#title').textContent=cur.name;
  if(objUrl) URL.revokeObjectURL(objUrl); objUrl=URL.createObjectURL(cur.play||cur.blob); audio.src=objUrl; audio.playbackRate=+LS.get('rate','1'); $('#rate').textContent=audio.playbackRate+'x';
  loopOn=false; $('#loop').classList.remove('on');
  MS.handlers(); MS.lastTitle=''; updateLockText();
  buildLyrics();
  if(!cur.transcript) analyze(cur);
}
function closePlayer(){ audio.pause(); MS.state('none'); cancelAnimationFrame(raf); cur=null; $('#player').classList.add('hidden'); $('#lib').classList.remove('hidden'); $('#back').classList.add('hidden'); $('#btnAnalyze').classList.add('hidden'); $('#title').textContent='Lingo Player'; }
$('#back').onclick=closePlayer;

function buildLyrics(){
  const L=$('#lyrics'); L.innerHTML=''; flat=[]; lineEls=[]; wordEls=[]; curW=-1; curL=-1;
  if(!cur.transcript){ L.innerHTML='<div class="empty">아직 단어 싱크가 없습니다.<br>오른쪽 위 <b>분석</b> 버튼을 누르면 Whisper로 단어 타이밍을 뽑습니다.</div>'; $('#btnAnalyze').textContent='분석'; return; }
  $('#btnAnalyze').textContent='재분석';
  const lang2=$('#lang2').value; if(engine!=='local'&&lang2&&!/\+/.test(cur.transcript.language||'')){ const h=document.createElement('div'); h.className='msg err'; h.textContent='이 분석은 두 번째 언어('+(LANGN[lang2]||lang2)+') 설정 전에 만든 것입니다. 오른쪽 위 "재분석"을 눌러 주세요.'; L.appendChild(h); }
  else if(cur.transcript.judgeTotal&&!cur.transcript.judged){ const h=document.createElement('div'); h.className='msg err'; h.textContent='언어 판정(LLM)이 실패해 기본 규칙으로만 합쳤습니다. 잠시 후 "재분석"하면 나아질 수 있습니다.'; L.appendChild(h); }
  const tl=$('#tlang').value; const trs=cur.translations[tl]||null;
  cur.transcript.segments.forEach((s,li)=>{
    const p=document.createElement('p'); p.className='line'; p.dataset.i=li;
    s.words.forEach(w=>{ const sp=document.createElement('span'); sp.className='w'; sp.textContent=w.w; const idx=flat.length; flat.push({...w,li}); wordEls.push(sp); sp.onclick=e=>{ e.stopPropagation(); showWord(idx); }; p.appendChild(sp); p.appendChild(document.createTextNode(' ')); });
    if(trs&&trs[li]){ const tr=document.createElement('span'); tr.className='tr'; tr.textContent=trs[li]; p.appendChild(tr); }
    p.onclick=()=>{ seek(s.s); if(audio.paused) audio.play(); };
    L.appendChild(p); lineEls.push(p);
  });
  if(!trs) ensureTranslation();
}
async function ensureTranslation(){
  const tl=$('#tlang').value; const t=cur; if(!t||!t.transcript||t.translations[tl]||!key) return;
  try{ const tr=await translateAll(t,tl); t.translations[tl]=tr; await DB.put(t); if(cur&&cur.id===t.id) { lineEls.forEach((p,li)=>{ if(tr[li]&&!p.querySelector('.tr')){ const s=document.createElement('span'); s.className='tr'; s.textContent=tr[li]; p.appendChild(s);} }); } }catch(e){ console.warn('translate',e); }
}
function seek(s){ audio.currentTime=Math.max(0,s+0.01); tick(true); }
function findWord(t){ let lo=0,hi=flat.length-1,ans=-1; while(lo<=hi){ const m=(lo+hi)>>1; if(flat[m].s<=t){ ans=m; lo=m+1; } else hi=m-1; } return ans; }
function tick(force){
  const t=audio.currentTime;
  $('#bar').value=audio.duration?Math.round(t/audio.duration*1000):0; $('#tCur').textContent=fmt(t);
  if(flat.length){
    let w=findWord(t); if(w>=0 && t>flat[w].e+0.35 && w<flat.length-1 && t<flat[w+1].s) { /* 단어 사이 공백: 마지막 단어 유지 */ }
    if(w!==curW||force){
      if(curW>=0&&wordEls[curW]) wordEls[curW].classList.remove('now');
      for(let i=curW+1;i<=w;i++) wordEls[i]&&wordEls[i].classList.add('done');
      for(let i=w+1;i<=curW;i++) wordEls[i]&&wordEls[i].classList.remove('done');
      if(force){ wordEls.forEach((e,i)=>e.classList.toggle('done',i<w)); }
      curW=w; if(w>=0){ wordEls[w].classList.add('now'); setLine(flat[w].li); }
    }
    if(loopOn&&curL>=0){ const s=cur.transcript.segments[curL]; if(t>=s.e-0.02||t<s.s-0.5){ audio.currentTime=s.s; } }
  }
  if(!audio.paused) raf=requestAnimationFrame(()=>tick(false));
}
function setLine(li){ if(li===curL) return; if(curL>=0&&lineEls[curL]) lineEls[curL].classList.remove('cur'); curL=li; updateLockText(); const p=lineEls[li]; if(!p) return; p.classList.add('cur');
  const L=$('#lyrics'); const top=p.offsetTop-L.clientHeight*0.35; L.scrollTo({top:Math.max(0,top),behavior:'smooth'}); }
audio.onplay=()=>{ $('#play').textContent='❚❚'; cancelAnimationFrame(raf); tick(false); MS.state('playing'); MS.pos(); };
let userPause=false;
audio.onpause=()=>{ STEP.mark('일시정지 '+fmt(audio.currentTime)+'/'+fmt(audio.duration)+(userPause?' (사용자)':' (시스템/기타)')+(document.hidden?' 백그라운드':'')+(audio.error?' 오류:'+audio.error.code:'')); userPause=false; $('#play').textContent='▶'; cancelAnimationFrame(raf); tick(true); MS.state('paused'); MS.pos(); };
audio.onended=()=>{ STEP.mark('재생 끝'); $('#play').textContent='▶'; MS.state('paused'); };
audio.onerror=()=>{ STEP.mark('오디오 오류 code='+(audio.error&&audio.error.code)+' '+(audio.error&&audio.error.message||'')); if(cur&&!cur.play&&audio.error&&(audio.error.code===3||audio.error.code===4)) repairPlayback(cur,audio.currentTime||0); };
let repairing=false;
async function repairPlayback(t,pos){
  if(repairing) return; repairing=true;
  const wasPlaying=$('#play').textContent!=='▶';
  $('#progMsg').textContent='손상된 오디오 파일: 재생용으로 변환 중…'; $('#progBar').classList.add('hidden'); $('#progCancel').classList.add('hidden'); $('#dProg').showModal();
  try{
    STEP.mark('재생용 변환 시작 '+t.name);
    const wav=await toPlayableWav(t.blob,(i,n)=>{ $('#progMsg').textContent='손상된 오디오 파일: 재생용으로 변환 중… '+i+'/'+n; });
    t.play=wav; await DB.put(t); STEP.mark('재생용 변환 완료 '+fmtSize(wav.size));
    if(cur&&cur.id===t.id){ cur.play=wav; if(objUrl) URL.revokeObjectURL(objUrl); objUrl=URL.createObjectURL(wav); audio.src=objUrl; audio.currentTime=pos; if(wasPlaying) audio.play().catch(()=>{}); }
  }catch(e){ STEP.mark('재생용 변환 실패: '+(e.message||e)); alert('이 파일은 재생할 수 없습니다 (손상된 MP3): '+(e.message||e)); }
  finally{ repairing=false; $('#dProg').close(); $('#progCancel').classList.remove('hidden'); }
}
audio.onstalled=()=>STEP.mark('오디오 stalled '+fmt(audio.currentTime));
audio.onwaiting=()=>STEP.mark('오디오 버퍼 대기 '+fmt(audio.currentTime));
audio.onratechange=()=>MS.pos();
audio.onseeked=()=>MS.pos();
audio.onloadedmetadata=()=>{ $('#tDur').textContent=fmt(audio.duration); if(cur&&!cur.duration&&isFinite(audio.duration)){ cur.duration=audio.duration; DB.put(cur).then(loadLib); } };
audio.ontimeupdate=()=>{ if(audio.paused||document.hidden) tick(false); };
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!audio.paused){ cancelAnimationFrame(raf); tick(true); } });
$('#play').onclick=()=>{ if(audio.paused){ STEP.mark('재생 '+fmt(audio.currentTime)); audio.play(); } else { userPause=true; audio.pause(); } };
$('#bar').oninput=()=>{ if(audio.duration) seek(audio.duration*$('#bar').value/1000); };
$('#back5').onclick=()=>seek(audio.currentTime-5);
$('#fwd5').onclick=()=>seek(audio.currentTime+5);
$('#prevL').onclick=()=>{ if(!cur||!cur.transcript) return seek(audio.currentTime-5); const segs=cur.transcript.segments; let li=curL; if(li>=0&&audio.currentTime-segs[li].s>1.5) return seek(segs[li].s); seek(segs[Math.max(0,li-1)].s); };
$('#nextL').onclick=()=>{ if(!cur||!cur.transcript) return seek(audio.currentTime+5); const segs=cur.transcript.segments; const li=Math.min(segs.length-1,curL+1); seek(segs[li].s); };
$('#loop').onclick=()=>{ loopOn=!loopOn; $('#loop').classList.toggle('on',loopOn); };
$('#rate').onclick=()=>{ const i=(RATES.indexOf(audio.playbackRate)+1)%RATES.length; audio.playbackRate=RATES[i]; LS.set('rate',RATES[i]); $('#rate').textContent=RATES[i]+'x'; };
$('#trToggle').onclick=()=>{ const off=document.body.classList.toggle('notr'); $('#trToggle').classList.toggle('on',!off); LS.set('notr',off?'1':'0'); };
$('#fsBtn').onclick=()=>{ const sizes=[16,20,24,28]; const c=+LS.get('fs','20'); const n=sizes[(sizes.indexOf(c)+1)%sizes.length]; LS.set('fs',n); document.documentElement.style.setProperty('--fs',n+'px'); };
$('#tlang').addEventListener('change',()=>{ if(cur&&cur.transcript) buildLyrics(); });

/* ---------- word popup ---------- */
let wpIdx=-1;
async function showWord(i){
  wpIdx=i; const w=flat[i]; const seg=cur.transcript.segments[w.li];
  $('#wpWord').textContent=w.w; $('#wpCtx').textContent=seg.text; $('#wpMean').innerHTML='<span class="spin"></span>';
  $('#wpop').showModal();
  const tl=$('#tlang').value; const k=tl+'|'+w.w.toLowerCase().replace(/[.,!?;:"'()]/g,'');
  if(cur.meanings[k]){ $('#wpMean').textContent=cur.meanings[k]; return; }
  if(!key){ $('#wpMean').textContent='뜻을 보려면 설정에서 API 키를 입력하세요.'; return; }
  try{ const m=await wordMeaning(w.w,seg.text,tl); cur.meanings[k]=m; await DB.put(cur); if(wpIdx===i) $('#wpMean').textContent=m; }
  catch(e){ if(wpIdx===i) $('#wpMean').textContent='실패: '+(e.message||e); }
}
$('#wpClose').onclick=()=>$('#wpop').close();
$('#wpHere').onclick=()=>{ $('#wpop').close(); if(wpIdx>=0){ seek(flat[wpIdx].s); audio.play(); } };

/* ---------- misc ---------- */
document.addEventListener('keydown',e=>{ if($('#player').classList.contains('hidden')||e.target.tagName==='INPUT') return; if(e.code==='Space'){ e.preventDefault(); $('#play').click(); } if(e.key==='ArrowLeft') $('#prevL').click(); if(e.key==='ArrowRight') $('#nextL').click(); });
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__lingo={buildTranscript,DB,openPlayer,decodeTo16k,decodeBuf16k,mp3Frames,toPlayableWav,mergeBilingual,setChunk:n=>{MP3_CHUNK=n},get cur(){return cur},get flat(){return flat}}; // 테스트용
loadLib();
})();
</script>
